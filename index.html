<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Urban footwear that blends comfort, style, and quality.">
    <title>Diogo Shoes | Step Bold, Stay Urban</title>
    <link rel="icon" href="images/logo.png">
    <link rel="stylesheet" href="styles.css">
    <script src="js/products.js" defer></script>
    <script src="js/cart.js" defer></script>
    <script src="js/main.js" defer></script>
    <script src="js/catalog.js" defer></script>
</head>

<body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
        <div class="header-inner">
            <a class="logo" href="index.html">
                <img src="images/logo.png" alt="Diogo Shoes home" width="120" height="87">
            </a>

            <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Open menu">
                <span class="nav-toggle-bar" aria-hidden="true"></span>
            </button>

            <nav id="site-nav" class="site-nav" aria-label="Main">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="aboutus.html">About Us</a></li>
                    <li><a href="learnmore.html">Learn More</a></li>
                    <li><a href="products.html">Products</a></li>
                </ul>
            </nav>

            <a class="cart-link" href="checkout.html" aria-label="Cart">
                <svg class="cart-icon" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false">
                    <path d="M6 7h12l-1 13H7L6 7Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                    <path d="M9 7a3 3 0 0 1 6 0" fill="none" stroke="currentColor" stroke-width="2"/>
                </svg>
                <span class="cart-count" data-cart-count hidden>0</span>
            </a>
        </div>
    </header>

    <main id="main">
        <section class="hero">
            <img src="images/step-bold-stay-urban.png" alt="Step Bold, Stay Urban" width="1440" height="418">
            <div class="hero-actions">
                <a class="button" href="products.html?category=men">Shop Men's</a>
                <a class="button button-outline" href="products.html?category=women">Shop Women's</a>
            </div>
        </section>

        <section class="panel" aria-labelledby="featured-heading">
            <h1 id="featured-heading">Featured Styles</h1>
            <div class="product-grid" data-product-grid data-featured="urban-court, cognac-ankle-boot, peach-oxford"></div>
            <p class="center-text"><a class="text-link" href="products.html">See all products &rarr;</a></p>
        </section>

        <template id="product-card-template">
            <article class="product-card">
                <img class="product-image" src="" alt="" width="400" height="500" loading="lazy">
                <div class="product-body">
                    <p class="product-category"></p>
                    <h2 class="product-name"></h2>
                    <p class="product-price"></p>
                    <label class="product-size-label">Size</label>
                    <select class="product-size">
                        <option value="">Choose a size</option>
                    </select>
                    <p class="field-error" aria-live="polite"></p>
                    <button class="button add-to-cart" type="button">Add to cart</button>
                </div>
            </article>
        </template>
    </main>

    <footer class="site-footer">
        <div class="footer-inner">
            <p class="locale"><img src="images/US.png" alt="" width="20" height="18"> US/EN</p>
            <ul class="footer-links">
                <li>Terms of Use</li>
                <li>Terms of Sale</li>
                <li>Privacy Policy</li>
                <li>Do Not Sell or Share My Personal Information</li>
            </ul>
            <p class="copyright">&copy; <span data-year>2024</span> Diogo Shoes</p>
        </div>
    </footer>
</body>

</html>
